<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc"><title id="title">AI 智学平台服务边界架构</title><desc id="desc">Next.js 经 Java 的身份权限和学习快照，调用 Python AI 服务；Python 编排 LangGraph、RAG 与模型，使用 PostgreSQL、pgvector 和 Redis。</desc><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#eaf5f4}.muted{fill:#96b6b4}.small{font-size:20px}.head{font-size:30px;font-weight:700}.box{fill:#102827;stroke:#396663;stroke-width:2}.sub{fill:#0c1d1d;stroke:#315552;stroke-width:2}.line{stroke:#64e8d0;stroke-width:3;fill:none}.label{fill:#64e8d0;font-size:17px;font-family:monospace}</style><rect width="1440" height="720" fill="#071615"/><text x="70" y="76" class="head">业务系统保留权限与数据，AI 服务专注编排与检索</text><text x="70" y="112" class="muted small">明确服务边界，避免 Python 绕过 Java 的业务授权</text><rect x="70" y="190" width="210" height="122" rx="14" class="box"/><text x="105" y="243" class="head">Next.js</text><text x="105" y="278" class="muted small">学生端体验</text><rect x="400" y="165" width="280" height="172" rx="14" class="box"/><text x="435" y="220" class="head">Spring Boot</text><text x="435" y="256" class="muted small">JWT · 业务权限 · 练习/错题</text><text x="435" y="291" class="muted small">Student Learning Snapshot</text><rect x="810" y="145" width="290" height="212" rx="14" class="box"/><text x="845" y="202" class="head">Python FastAPI</text><text x="845" y="238" class="muted small">Service Auth · LangGraph</text><text x="845" y="273" class="muted small">业务上下文 · RAG · Prompt</text><text x="845" y="308" class="muted small">Real LLM 编排</text><rect x="1190" y="105" width="180" height="92" rx="12" class="sub"/><text x="1225" y="159" class="head">Qwen</text><rect x="1190" y="245" width="180" height="92" rx="12" class="sub"/><text x="1214" y="300" class="head">Gemini</text><rect x="810" y="470" width="250" height="120" rx="14" class="sub"/><text x="844" y="520" class="head">PostgreSQL</text><text x="844" y="556" class="muted small">会话 / 消息 / 运行记录</text><rect x="1110" y="470" width="260" height="120" rx="14" class="sub"/><text x="1145" y="520" class="head">pgvector · Redis</text><text x="1145" y="556" class="muted small">知识检索 / 异步 Worker</text><path d="M280 251H400M680 251H810M1100 190H1190M1100 292H1190M955 357V470M1030 357V410H1240V470" class="line"/><text x="300" y="232" class="label">JWT</text><text x="695" y="232" class="label">Service Auth</text></svg>
