<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">AI 智学平台服务边界架构</title><desc id="desc">Next.js 通过 Spring Boot 的 JWT 身份与业务权限调用 FastAPI AI 服务，AI 服务通过 LangGraph、RAG、Qwen 和 PostgreSQL、pgvector、Redis Worker 完成编排与持久化。</desc><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#eff6ff}.label{fill:#90bdfc;font:600 17px monospace}.head{font-size:27px;font-weight:700}.body{fill:#b9c8d9;font-size:18px}.box{fill:#162231;stroke:#40566c;stroke-width:2}.inner{fill:#101a26;stroke:#354b60;stroke-width:2}.line{stroke:#78aefb;stroke-width:3;fill:none}.note{fill:#aabbd0;font-size:15px}</style><rect width="1440" height="760" fill="#0d1520"/><text x="70" y="64" class="head">体验层 → 业务系统 → AI 服务 → 数据与运行基础设施</text><text x="70" y="96" class="note">学生身份与业务权限始终由 Java 管理；课程知识检索独立于业务数据。</text><rect x="70" y="180" width="180" height="120" rx="12" class="box"/><text x="105" y="233" class="head">Next.js</text><text x="105" y="265" class="body">学习体验层</text><rect x="350" y="140" width="330" height="200" rx="12" class="box"/><text x="385" y="195" class="head">Spring Boot</text><text x="385" y="229" class="body">Auth · Practice · Wrong Questions</text><text x="385" y="263" class="body">Growth · Student Snapshot</text><text x="385" y="307" class="label">业务权限 / 结构化学习数据</text><rect x="790" y="120" width="310" height="240" rx="12" class="box"/><text x="825" y="178" class="head">FastAPI + LangGraph</text><text x="825" y="214" class="body">Business Context · RAG · Prompt</text><text x="825" y="248" class="body">Qwen · Agent Orchestration</text><text x="825" y="320" class="label">AI 编排 / 检索 / 模型调用</text><rect x="1190" y="115" width="180" height="105" rx="12" class="inner"/><text x="1224" y="165" class="head">Qwen</text><text x="1224" y="194" class="note">生成讲解</text><rect x="1190" y="255" width="180" height="105" rx="12" class="inner"/><text x="1214" y="305" class="head">Gemini</text><text x="1214" y="334" class="note">1024D 向量</text><rect x="790" y="505" width="250" height="125" rx="12" class="inner"/><text x="825" y="554" class="head">PostgreSQL</text><text x="825" y="588" class="body">session / message / run / usage</text><rect x="1105" y="505" width="265" height="125" rx="12" class="inner"/><text x="1140" y="554" class="head">pgvector · Redis</text><text x="1140" y="588" class="body">知识检索 / 异步 Worker</text><path d="M250 240h100m330 0h110m310-70h90m-90 138h90m-245 52v145m-80-145v80h245v65" class="line"/><text x="273" y="218" class="label">JWT</text><text x="697" y="218" class="label">Service Auth</text><text x="70" y="700" class="note">架构原则：Python 不直接读取 Java 业务库；学生学习快照与课程 RAG 知识库分离。</text></svg>
