          , [])\n        if not isinstance(refs, list) or any(ref not in known_ids\
          \ for ref in refs):\n            errors.append(f\"Unresolved evidenceRefs\
          \ at registry index {index}\")\n\n    required = REQUIRED_OUTPUTS.get(stage,\
          \ set())\n    missing = sorted(required - set(output.keys()))\n    if missing:\n\
          \        errors.append(\"Missing stageOutput keys: \" + \", \".join(missing))\n\
          \n    readiness = \"\"\n    assurance_status = \"\"\n    can_generate_report\
          \ = False\n\n    if stage == \"INTAKE\":\n        readiness = output.get(\"\
          readiness\", \"\")\n        if readiness not in {\"READY\", \"READY_WITH_GAPS\"\
          , \"BLOCKED\"}:\n            errors.append(\"Invalid Intake readiness\"\
          )\n        questions = output.get(\"blockingQuestions\", [])\n        if\
          \ readiness == \"BLOCKED\" and not questions:\n            errors.append(\"\
