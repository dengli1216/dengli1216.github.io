        code: "import json\n\nWRAPPER_KEYS = (\n    \"reusable_intake_artifact_json\"\
          ,\n    \"intake_artifact_json\",\n    \"artifact_json\",\n)\n\ndef _decode_json(value):\n\
          \    current = value\n    for _ in range(3):\n        if not isinstance(current,\
          \ str):\n            return current\n        text = current.strip()\n  \
          \      if not text:\n            raise ValueError(\"Intake input is empty\"\
          )\n        if text.startswith(\"```\"):\n            lines = text.splitlines()\n\
          \            if lines and lines[0].startswith(\"```\"):\n              \
          \  lines = lines[1:]\n            if lines and lines[-1].strip() == \"```\"\
          :\n                lines = lines[:-1]\n            text = \"\\n\".join(lines).strip()\n\
          \        current = json.loads(text)\n    return current\n\ndef main(candidate_json:\
          \ str) -> dict:\n    if not isinstance(candidate_json, str) or not candidate_json.strip():\n\
          \        raise ValueError(\"No Intake input was provided\")\n    decoded\
          \ = _decode_json(candidate_json)\n    artifact = decoded\n    if isinstance(decoded,\
          \ dict) and not isinstance(decoded.get(\"artifact\"), dict):\n        artifact\
          \ = None\n        for key in WRAPPER_KEYS:\n            if key in decoded:\n\
          \                artifact = _decode_json(decoded[key])\n               \
          \ break\n    case_id = artifact.get(\"artifact\", {}).get(\"caseId\") if\
          \ isinstance(artifact, dict) else None\n    if not isinstance(case_id, str)\
          \ or not case_id:\n        raise ValueError(\n            \"Intake input\
          \ must be the App 01 full output or reusable_intake_artifact_json\"\n  \
          \      )\n    return {\n        \"artifact_json\": json.dumps(artifact,\
          \ ensure_ascii=False, separators=(\",\", \":\")),\n        \"case_id\":\
          \ case_id,\n        \"empty_previous_artifact\": \"\"\n    }\n"
