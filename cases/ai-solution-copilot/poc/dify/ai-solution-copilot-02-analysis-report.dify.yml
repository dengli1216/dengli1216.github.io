    - data:
        code: "import json\n\nSTAGE_ORDER = [\n    \"INTAKE\", \"DISCOVERY\", \"OPPORTUNITY_ASSESSMENT\"\
          ,\n    \"SOLUTION_DESIGN\", \"POC_DESIGN\", \"ASSURANCE\", \"FINAL_REPORT\"\
          \n]\nEVIDENCE_TYPES = {\"FACT\", \"ASSUMPTION\", \"RULE\", \"FINDING\",\
          \ \"DECISION\", \"RISK\"}\nREQUIRED_OUTPUTS = {\n    \"INTAKE\": {\"scenarioSummary\"\
          , \"factIds\", \"informationCoverage\", \"readiness\", \"blockingQuestions\"\
          , \"handoffSummary\"},\n    \"DISCOVERY\": {\"processBoundary\", \"actors\"\
          , \"processSteps\", \"painPoints\", \"baselineKpis\", \"constraints\", \"\
          findingIds\", \"informationGaps\", \"handoffSummary\"},\n    \"OPPORTUNITY_ASSESSMENT\"\
          : {\"assessmentQuestion\", \"options\", \"selectedOption\", \"agentJustification\"\
          , \"decisionRuleIds\", \"handoffSummary\"},\n    \"SOLUTION_DESIGN\": {\"\
          decisionId\", \"selectedApproach\", \"containsAgent\", \"processChanges\"\
          , \"components\", \"dataRequirements\", \"integrations\", \"humanControls\"\
          , \"feasibility\", \"businessValue\", \"riskIds\", \"handoffSummary\"},\n\
          \    \"POC_DESIGN\": {\"decisionId\", \"selectedApproach\", \"containsAgent\"\
          , \"hypothesis\", \"scopeIn\", \"scopeOut\", \"testDesign\", \"metrics\"\
          , \"dependencies\", \"riskControls\", \"exitCriteria\", \"handoffSummary\"\
          },\n    \"ASSURANCE\": {\"status\", \"canGenerateFinalReport\", \"checks\"\
          , \"issues\", \"unresolvedAssumptions\", \"approvedReportInputs\"},\n  \
          \  \"FINAL_REPORT\": {\"status\", \"title\", \"audience\", \"executiveSummary\"\
          , \"businessValue\", \"recommendation\", \"feasibility\", \"solutionOverview\"\
          , \"pocPlan\", \"risks\", \"nextSteps\", \"factAssumptionDisclosure\", \"\
          traceabilityAppendix\", \"reportMarkdown\"},\n}\n\ndef _clean_json(value):\n\
          \    if not isinstance(value, str):\n        raise ValueError(\"artifact_json\
          \ must be a string\")\n    text = value.strip()\n    if not text:\n    \
          \    raise ValueError(\"Upstream LLM returned empty text; use a non-reasoning\
          \ model or disable thinking\")\n    if text.startswith(\"```\"):\n     \
          \   lines = text.splitlines()\n        if lines and lines[0].startswith(\"\
          ```\"):\n            lines = lines[1:]\n        if lines and lines[-1].strip()\
          \ == \"```\":\n            lines = lines[:-1]\n        text = \"\\n\".join(lines).strip()\n\
          \    return json.loads(text)\n\ndef _expand_delta(candidate: dict, previous:\
          \ dict, case_id: str) -> dict:\n    if previous is None or not isinstance(candidate,\
          \ dict) or \"newEvidence\" not in candidate:\n        return candidate\n\
          \    meta_delta = candidate.get(\"artifact\", {})\n    new_evidence = candidate.get(\"\
          newEvidence\", [])\n    previous_meta = previous.get(\"artifact\", {})\n\
          \    if not isinstance(meta_delta, dict) or not isinstance(new_evidence,\
          \ list):\n        raise ValueError(\"Incremental artifact requires object\
          \ artifact and array newEvidence\")\n    return {\n        \"artifact\"\
          : {\n            \"caseId\": case_id,\n            \"artifactId\": meta_delta.get(\"\
          artifactId\"),\n            \"schemaVersion\": previous_meta.get(\"schemaVersion\"\
          ),\n            \"stage\": meta_delta.get(\"stage\"),\n            \"generatedAt\"\
          : meta_delta.get(\"generatedAt\"),\n            \"inputArtifactId\": previous_meta.get(\"\
          artifactId\"),\n            \"lineage\": list(previous_meta.get(\"lineage\"\
          , [])) + [previous_meta.get(\"artifactId\")],\n        },\n        \"evidenceRegistry\"\
          : list(previous.get(\"evidenceRegistry\", [])) + new_evidence,\n       \
          \ \"stageOutput\": candidate.get(\"stageOutput\"),\n    }\n\ndef main(candidate_json:\
          \ str, previous_json: str, case_id: str) -> dict:\n    raw_candidate = _clean_json(candidate_json)\n\
          \    previous = _clean_json(previous_json) if previous_json and previous_json.strip()\
          \ else None\n    candidate = _expand_delta(raw_candidate, previous, case_id)\n\
          \    errors = []\n\n    if not isinstance(candidate, dict):\n        raise\
          \ ValueError(\"Artifact must be a JSON object\")\n    if set(candidate.keys())\
          \ != {\"artifact\", \"evidenceRegistry\", \"stageOutput\"}:\n        errors.append(\"\
          Top level must contain only artifact, evidenceRegistry, stageOutput\")\n\
          \n    meta = candidate.get(\"artifact\")\n    registry = candidate.get(\"\
          evidenceRegistry\")\n    output = candidate.get(\"stageOutput\")\n    if\
          \ not isinstance(meta, dict):\n        errors.append(\"artifact must be\
          \ an object\")\n        meta = {}\n    if not isinstance(registry, list):\n\
          \        errors.append(\"evidenceRegistry must be an array\")\n        registry\
          \ = []\n    if not isinstance(output, dict):\n        errors.append(\"stageOutput\
          \ must be an object\")\n        output = {}\n\n    stage = meta.get(\"stage\"\
          )\n    if stage not in STAGE_ORDER:\n        errors.append(f\"Unknown stage:\
          \ {stage}\")\n    if meta.get(\"caseId\") != case_id:\n        errors.append(\"\
          caseId does not match workflow input\")\n    if not isinstance(meta.get(\"\
          artifactId\"), str) or not meta.get(\"artifactId\"):\n        errors.append(\"\
          artifactId is required\")\n    if meta.get(\"schemaVersion\") != \"1.0.0\"\
          :\n        errors.append(\"schemaVersion must be 1.0.0\")\n    if not isinstance(meta.get(\"\
          generatedAt\"), str) or not meta.get(\"generatedAt\"):\n        errors.append(\"\
