          :\n        options = output.get(\"options\", [])\n        approaches = {item.get(\"\
          approach\") for item in options if isinstance(item, dict)}\n        non_ai\
          \ = {\"PROCESS_REDESIGN\", \"RULES\", \"TRADITIONAL_SOFTWARE\", \"API\"\
          , \"RPA\"}\n        if \"DO_NOTHING\" not in approaches:\n            errors.append(\"\
          Opportunity options must include DO_NOTHING\")\n        if not approaches.intersection(non_ai):\n\
          \            errors.append(\"Opportunity options must include a credible\
          \ non-AI alternative\")\n        selected = output.get(\"selectedOption\"\
          , {})\n        if selected.get(\"containsAgent\") is True and not isinstance(output.get(\"\
          agentJustification\"), dict):\n            errors.append(\"Agent selection\
          \ requires structured agentJustification\")\n\n    if stage == \"SOLUTION_DESIGN\"\
          \ and previous:\n        selected = previous.get(\"stageOutput\", {}).get(\"\
          selectedOption\", {})\n        if output.get(\"selectedApproach\") != selected.get(\"\
          approach\"):\n            errors.append(\"selectedApproach drifted from\
          \ Opportunity Assessment\")\n        if output.get(\"containsAgent\") !=\
          \ selected.get(\"containsAgent\"):\n            errors.append(\"containsAgent\
          \ drifted from Opportunity Assessment\")\n        if output.get(\"decisionId\"\
          ) != selected.get(\"decisionId\"):\n            errors.append(\"decisionId\
          \ drifted from Opportunity Assessment\")\n\n    if stage == \"POC_DESIGN\"\
          \ and previous:\n        prior = previous.get(\"stageOutput\", {})\n   \
          \     for key in (\"decisionId\", \"selectedApproach\", \"containsAgent\"\
          ):\n            if output.get(key) != prior.get(key):\n                errors.append(f\"\
          {key} drifted from Solution Design\")\n        metrics = output.get(\"metrics\"\
          , [])\n        if not isinstance(metrics, list) or not 3 <= len(metrics)\
          \ <= 5:\n            errors.append(\"POC metrics must contain 3 to 5 decision-driving\
          \ metrics\")\n\n    if stage == \"ASSURANCE\":\n        assurance_status\
          \ = output.get(\"status\", \"\")\n        can_generate_report = output.get(\"\
          canGenerateFinalReport\") is True\n        if assurance_status not in {\"\
          PASS\", \"REVISE\", \"BLOCKED\"}:\n            errors.append(\"Invalid Assurance\
          \ status\")\n        if (assurance_status == \"PASS\") != can_generate_report:\n\
          \            errors.append(\"Only PASS may set canGenerateFinalReport=true\"\
          )\n        required_checks = {\n            \"FACT_INTEGRITY\", \"MISSING_INFORMATION\"\
          , \"AGENT_BIAS\",\n            \"CROSS_STAGE_CONSISTENCY\", \"TRACEABILITY\"\
          , \"POC_METRIC_FOCUS\"\n        }\n        actual_checks = {\n         \
          \   item.get(\"checkType\") for item in output.get(\"checks\", []) if isinstance(item,\
          \ dict)\n        }\n        if not required_checks.issubset(actual_checks):\n\
          \            errors.append(\"Assurance must include all six required check\
          \ types\")\n\n    report_markdown = \"\"\n    if stage == \"FINAL_REPORT\"\
          :\n        if output.get(\"status\") != \"READY_FOR_HUMAN_REVIEW\":\n  \
          \          errors.append(\"Final report status must be READY_FOR_HUMAN_REVIEW\"\
          )\n        report_markdown = output.get(\"reportMarkdown\", \"\")\n    \
          \    if not isinstance(report_markdown, str) or not report_markdown.strip():\n\
          \            errors.append(\"Final report must contain non-empty reportMarkdown\"\
          )\n\n    stage_message_markdown = \"\"\n    if stage == \"INTAKE\":\n  \
          \      questions = output.get(\"blockingQuestions\", [])\n        if isinstance(questions,\
          \ list) and questions:\n            lines = []\n            for item in\
          \ questions:\n                if isinstance(item, dict):\n             \
          \       text = item.get(\"question\") or item.get(\"statement\") or json.dumps(item,\
          \ ensure_ascii=False)\n                else:\n                    text =\
          \ str(item)\n                lines.append(f\"- {text}\")\n            stage_message_markdown\
