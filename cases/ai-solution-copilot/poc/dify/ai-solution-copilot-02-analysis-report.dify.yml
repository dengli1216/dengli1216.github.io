    - data:
        code: "import json\n\nSTAGE_ORDER = [\n    \"INTAKE\", \"DISCOVERY\", \"OPPORTUNITY_ASSESSMENT\"\
          ,\n    \"SOLUTION_DESIGN\", \"POC_DESIGN\", \"ASSURANCE\", \"FINAL_REPORT\"\
          \n]\nEVIDENCE_TYPES = {\"FACT\", \"ASSUMPTION\", \"RULE\", \"FINDING\",\
          \ \"DECISION\", \"RISK\"}\nREQUIRED_OUTPUTS = {\n    \"INTAKE\": {\"scenarioSummary\"\
          , \"factIds\", \"informationCoverage\", \"readiness\", \"blockingQuestions\"\
          , \"handoffSummary\"},\n    \"DISCOVERY\": {\"processBoundary\", \"actors\"\
          , \"processSteps\", \"painPoints\", \"baselineKpis\", \"constraints\", \"\
          findingIds\", \"informationGaps\", \"handoffSummary\"},\n    \"OPPORTUNITY_ASSESSMENT\"\
          : {\"assessmentQuestion\", \"options\", \"selectedOption\", \"agentJustification\"\
          , \"decisionRuleIds\", \"handoffSummary\"},\n    \"SOLUTION_DESIGN\": {\"\
          decisionId\", \"selectedApproach\", \"containsAgent\", \"processChanges\"\
          , \"components\", \"dataRequirements\", \"integrations\", \"humanControls\"\
          , \"feasibility\", \"businessValue\", \"riskIds\", \"handoffSummary\"},\n\
          \    \"POC_DESIGN\": {\"decisionId\", \"selectedApproach\", \"containsAgent\"\
          , \"hypothesis\", \"scopeIn\", \"scopeOut\", \"testDesign\", \"metrics\"\
          , \"dependencies\", \"riskControls\", \"exitCriteria\", \"handoffSummary\"\
          },\n    \"ASSURANCE\": {\"status\", \"canGenerateFinalReport\", \"checks\"\
          , \"issues\", \"unresolvedAssumptions\", \"approvedReportInputs\"},\n  \
          \  \"FINAL_REPORT\": {\"status\", \"title\", \"audience\", \"executiveSummary\"\
          , \"businessValue\", \"recommendation\", \"feasibility\", \"solutionOverview\"\
          , \"pocPlan\", \"risks\", \"nextSteps\", \"factAssumptionDisclosure\", \"\
          traceabilityAppendix\", \"reportMarkdown\"},\n}\n\ndef _clean_json(value):\n\
          \    if not isinstance(value, str):\n        raise ValueError(\"artifact_json\
          \ must be a string\")\n    text = value.strip()\n    if not text:\n    \
          \    raise ValueError(\"Upstream LLM returned empty text; use a non-reasoning\
          \ model or disable thinking\")\n    if text.startswith(\"```\"):\n     \
          \   lines = text.splitlines()\n        if lines and lines[0].startswith(\"\
          ```\"):\n            lines = lines[1:]\n        if lines and lines[-1].strip()\
          \ == \"```\":\n            lines = lines[:-1]\n        text = \"\\n\".join(lines).strip()\n\
          \    return json.loads(text)\n\ndef _expand_delta(candidate: dict, previous:\
          \ dict, case_id: str) -> dict:\n    if previous is None or not isinstance(candidate,\
          \ dict) or \"newEvidence\" not in candidate:\n        return candidate\n\
          \    meta_delta = candidate.get(\"artifact\", {})\n    new_evidence = candidate.get(\"\
          newEvidence\", [])\n    previous_meta = previous.get(\"artifact\", {})\n\
          \    if not isinstance(meta_delta, dict) or not isinstance(new_evidence,\
          \ list):\n        raise ValueError(\"Incremental artifact requires object\
          \ artifact and array newEvidence\")\n    return {\n        \"artifact\"\
          : {\n            \"caseId\": case_id,\n            \"artifactId\": meta_delta.get(\"\
          artifactId\"),\n            \"schemaVersion\": previous_meta.get(\"schemaVersion\"\
          ),\n            \"stage\": meta_delta.get(\"stage\"),\n            \"generatedAt\"\
          : meta_delta.get(\"generatedAt\"),\n            \"inputArtifactId\": previous_meta.get(\"\
          artifactId\"),\n            \"lineage\": list(previous_meta.get(\"lineage\"\
          , [])) + [previous_meta.get(\"artifactId\")],\n        },\n        \"evidenceRegistry\"\
          : list(previous.get(\"evidenceRegistry\", [])) + new_evidence,\n       \
          \ \"stageOutput\": candidate.get(\"stageOutput\"),\n    }\n\ndef main(candidate_json:\
          \ str, previous_json: str, case_id: str) -> dict:\n    raw_candidate = _clean_json(candidate_json)\n\
          \    previous = _clean_json(previous_json) if previous_json and previous_json.strip()\
          \ else None\n    candidate = _expand_delta(raw_candidate, previous, case_id)\n\
          \    errors = []\n\n    if not isinstance(candidate, dict):\n        raise\
          \ ValueError(\"Artifact must be a JSON object\")\n    if set(candidate.keys())\
          \ != {\"artifact\", \"evidenceRegistry\", \"stageOutput\"}:\n        errors.append(\"\
          Top level must contain only artifact, evidenceRegistry, stageOutput\")\n\
          \n    meta = candidate.get(\"artifact\")\n    registry = candidate.get(\"\
          evidenceRegistry\")\n    output = candidate.get(\"stageOutput\")\n    if\
          \ not isinstance(meta, dict):\n        errors.append(\"artifact must be\
          \ an object\")\n        meta = {}\n    if not isinstance(registry, list):\n\
          \        errors.append(\"evidenceRegistry must be an array\")\n        registry\
          \ = []\n    if not isinstance(output, dict):\n        errors.append(\"stageOutput\
          \ must be an object\")\n        output = {}\n\n    stage = meta.get(\"stage\"\
          )\n    if stage not in STAGE_ORDER:\n        errors.append(f\"Unknown stage:\
          \ {stage}\")\n    if meta.get(\"caseId\") != case_id:\n        errors.append(\"\
          caseId does not match workflow input\")\n    if not isinstance(meta.get(\"\
          artifactId\"), str) or not meta.get(\"artifactId\"):\n        errors.append(\"\
          artifactId is required\")\n    if meta.get(\"schemaVersion\") != \"1.0.0\"\
          :\n        errors.append(\"schemaVersion must be 1.0.0\")\n    if not isinstance(meta.get(\"\
          generatedAt\"), str) or not meta.get(\"generatedAt\"):\n        errors.append(\"\
          generatedAt ISO-8601 string is required\")\n\n    if previous is None:\n\
          \        if stage != \"INTAKE\":\n            errors.append(\"First artifact\
          \ must be INTAKE\")\n        if meta.get(\"inputArtifactId\") is not None:\n\
          \            errors.append(\"INTAKE inputArtifactId must be null\")\n  \
          \      if meta.get(\"lineage\") != []:\n            errors.append(\"INTAKE\
          \ lineage must be empty\")\n    else:\n        prev_meta = previous.get(\"\
          artifact\", {})\n        prev_stage = prev_meta.get(\"stage\")\n       \
          \ expected_index = STAGE_ORDER.index(prev_stage) + 1 if prev_stage in STAGE_ORDER\
          \ else -1\n        expected_stage = STAGE_ORDER[expected_index] if 0 <=\
          \ expected_index < len(STAGE_ORDER) else None\n        if stage != expected_stage:\n\
          \            errors.append(f\"Expected stage {expected_stage}, found {stage}\"\
          )\n        if meta.get(\"inputArtifactId\") != prev_meta.get(\"artifactId\"\
          ):\n            errors.append(\"inputArtifactId does not reference the immediate\
          \ predecessor\")\n        expected_lineage = list(prev_meta.get(\"lineage\"\
          , [])) + [prev_meta.get(\"artifactId\")]\n        if meta.get(\"lineage\"\
          ) != expected_lineage:\n            errors.append(\"lineage is not the exact\
          \ predecessor chain\")\n        if meta.get(\"artifactId\") == prev_meta.get(\"\
          artifactId\"):\n            errors.append(\"artifactId must be unique per\
          \ stage\")\n        prior_registry = previous.get(\"evidenceRegistry\",\
          \ [])\n        if registry[:len(prior_registry)] != prior_registry:\n  \
          \          errors.append(\"Previous Evidence Registry was modified, reordered,\
          \ or deleted\")\n        for record in registry[len(prior_registry):]:\n\
          \            if record.get(\"type\") == \"FACT\":\n                errors.append(\"\
          FACT may only be introduced at INTAKE\")\n            if record.get(\"introducedAtStage\"\
          ) != stage:\n                errors.append(\"New evidence introducedAtStage\
          \ must equal current stage\")\n\n    evidence_ids = []\n    for index, record\
          \ in enumerate(registry):\n        if not isinstance(record, dict):\n  \
          \          errors.append(f\"evidenceRegistry[{index}] must be an object\"\
          )\n            continue\n        record_id = record.get(\"id\")\n      \
          \  record_type = record.get(\"type\")\n        if record_type not in EVIDENCE_TYPES:\n\
          \            errors.append(f\"Unsupported evidence type at index {index}\"\
          )\n        if not isinstance(record_id, str) or not record_id.startswith(f\"\
          {record_type}-\"):\n            errors.append(f\"Evidence ID/type mismatch\
          \ at index {index}\")\n        evidence_ids.append(record_id)\n        if\
          \ record_type == \"FACT\" and record.get(\"introducedAtStage\") != \"INTAKE\"\
          :\n            errors.append(f\"{record_id} was introduced outside INTAKE\"\
          )\n    if len(evidence_ids) != len(set(evidence_ids)):\n        errors.append(\"\
          Evidence IDs must be unique\")\n    known_ids = set(evidence_ids)\n    for\
          \ index, record in enumerate(registry):\n        if not isinstance(record,\
          \ dict):\n            continue\n        refs = record.get(\"evidenceRefs\"\
          , [])\n        if not isinstance(refs, list) or any(ref not in known_ids\
          \ for ref in refs):\n            errors.append(f\"Unresolved evidenceRefs\
          \ at registry index {index}\")\n\n    required = REQUIRED_OUTPUTS.get(stage,\
          \ set())\n    missing = sorted(required - set(output.keys()))\n    if missing:\n\
          \        errors.append(\"Missing stageOutput keys: \" + \", \".join(missing))\n\
          \n    readiness = \"\"\n    assurance_status = \"\"\n    can_generate_report\
          \ = False\n\n    if stage == \"INTAKE\":\n        readiness = output.get(\"\
          readiness\", \"\")\n        if readiness not in {\"READY\", \"READY_WITH_GAPS\"\
          , \"BLOCKED\"}:\n            errors.append(\"Invalid Intake readiness\"\
          )\n        questions = output.get(\"blockingQuestions\", [])\n        if\
          \ readiness == \"BLOCKED\" and not questions:\n            errors.append(\"\
          BLOCKED Intake must contain blockingQuestions\")\n\n    if stage == \"OPPORTUNITY_ASSESSMENT\"\
          :\n        options = output.get(\"options\", [])\n        approaches = {item.get(\"\
          approach\") for item in options if isinstance(item, dict)}\n        non_ai\
          \ = {\"PROCESS_REDESIGN\", \"RULES\", \"TRADITIONAL_SOFTWARE\", \"API\"\
          , \"RPA\"}\n        if \"DO_NOTHING\" not in approaches:\n            errors.append(\"\
          Opportunity options must include DO_NOTHING\")\n        if not approaches.intersection(non_ai):\n\
          \            errors.append(\"Opportunity options must include a credible\
          \ non-AI alternative\")\n        selected = output.get(\"selectedOption\"\
          , {})\n        if selected.get(\"containsAgent\") is True and not isinstance(output.get(\"\
          agentJustification\"), dict):\n            errors.append(\"Agent selection\
          \ requires structured agentJustification\")\n\n    if stage == \"SOLUTION_DESIGN\"\
          \ and previous:\n        selected = previous.get(\"stageOutput\", {}).get(\"\
          selectedOption\", {})\n        if output.get(\"selectedApproach\") != selected.get(\"\
          approach\"):\n            errors.append(\"selectedApproach drifted from\
          \ Opportunity Assessment\")\n        if output.get(\"containsAgent\") !=\
          \ selected.get(\"containsAgent\"):\n            errors.append(\"containsAgent\
          \ drifted from Opportunity Assessment\")\n        if output.get(\"decisionId\"\
          ) != selected.get(\"decisionId\"):\n            errors.append(\"decisionId\
          \ drifted from Opportunity Assessment\")\n\n    if stage == \"POC_DESIGN\"\
          \ and previous:\n        prior = previous.get(\"stageOutput\", {})\n   \
          \     for key in (\"decisionId\", \"selectedApproach\", \"containsAgent\"\
          ):\n            if output.get(key) != prior.get(key):\n                errors.append(f\"\
          {key} drifted from Solution Design\")\n        metrics = output.get(\"metrics\"\
          , [])\n        if not isinstance(metrics, list) or not 3 <= len(metrics)\
          \ <= 5:\n            errors.append(\"POC metrics must contain 3 to 5 decision-driving\
          \ metrics\")\n\n    if stage == \"ASSURANCE\":\n        assurance_status\
          \ = output.get(\"status\", \"\")\n        can_generate_report = output.get(\"\
          canGenerateFinalReport\") is True\n        if assurance_status not in {\"\
          PASS\", \"REVISE\", \"BLOCKED\"}:\n            errors.append(\"Invalid Assurance\
          \ status\")\n        if (assurance_status == \"PASS\") != can_generate_report:\n\
          \            errors.append(\"Only PASS may set canGenerateFinalReport=true\"\
          )\n        required_checks = {\n            \"FACT_INTEGRITY\", \"MISSING_INFORMATION\"\
          , \"AGENT_BIAS\",\n            \"CROSS_STAGE_CONSISTENCY\", \"TRACEABILITY\"\
          , \"POC_METRIC_FOCUS\"\n        }\n        actual_checks = {\n         \
          \   item.get(\"checkType\") for item in output.get(\"checks\", []) if isinstance(item,\
          \ dict)\n        }\n        if not required_checks.issubset(actual_checks):\n\
          \            errors.append(\"Assurance must include all six required check\
          \ types\")\n\n    report_markdown = \"\"\n    if stage == \"FINAL_REPORT\"\
          :\n        if output.get(\"status\") != \"READY_FOR_HUMAN_REVIEW\":\n  \
          \          errors.append(\"Final report status must be READY_FOR_HUMAN_REVIEW\"\
          )\n        report_markdown = output.get(\"reportMarkdown\", \"\")\n    \
          \    if not isinstance(report_markdown, str) or not report_markdown.strip():\n\
          \            errors.append(\"Final report must contain non-empty reportMarkdown\"\
          )\n\n    stage_message_markdown = \"\"\n    if stage == \"INTAKE\":\n  \
          \      questions = output.get(\"blockingQuestions\", [])\n        if isinstance(questions,\
          \ list) and questions:\n            lines = []\n            for item in\
          \ questions:\n                if isinstance(item, dict):\n             \
          \       text = item.get(\"question\") or item.get(\"statement\") or json.dumps(item,\
          \ ensure_ascii=False)\n                else:\n                    text =\
          \ str(item)\n                lines.append(f\"- {text}\")\n            stage_message_markdown\
          \ = \"## 需要补充的资料\\n\\n\" + \"\\n\".join(lines)\n        else:\n        \
          \    stage_message_markdown = f\"Intake readiness: {readiness}\"\n    elif\
          \ stage == \"ASSURANCE\":\n        issues = output.get(\"issues\", [])\n\
          \        issue_text = json.dumps(issues, ensure_ascii=False, indent=2) if\
          \ issues else \"无阻断问题\"\n        stage_message_markdown = f\"## Assurance：{assurance_status}\\\
          n\\n{issue_text}\"\n\n    if errors:\n        raise ValueError(\" | \".join(errors))\n\
          \n    return {\n        \"artifact_json\": json.dumps(candidate, ensure_ascii=False,\
          \ separators=(\",\", \":\")),\n        \"readiness\": readiness,\n     \
          \   \"assurance_status\": assurance_status,\n        \"can_generate_report\"\
          : can_generate_report,\n        \"gate_result\": f\"PASS:{stage}\",\n  \
          \      \"stage_message_markdown\": stage_message_markdown,\n        \"report_markdown\"\
          : report_markdown\n    }\n"
        code_language: python3
        outputs:
          artifact_json:
            children: null
            type: string
          assurance_status:
            children: null
            type: string
          can_generate_report:
