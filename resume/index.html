<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="邓丽｜AI 售前解决方案 / 技术支持简历" />
  <title>邓丽｜AI 售前解决方案 / 技术支持</title>
  <style>
    :root { color-scheme: light; --ink: #18313a; --muted: #62747a; --line: #d8e1e3; --page: #f5f8f8; --accent: #0f7480; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; overflow-x: hidden; }
    body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
    a { color: inherit; text-decoration: none; }
    .site-header { min-height: 64px; padding: 12px clamp(16px, 4vw, 48px); display: flex; align-items: center; justify-content: space-between; gap: 16px; background: #fff; border-bottom: 1px solid var(--line); }
    .title { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .01em; }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .action { min-height: 36px; padding: 7px 12px; border: 1px solid var(--line); background: #fff; color: var(--ink); font-size: 13px; white-space: nowrap; }
    .action:hover, .action:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
    .action-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .action-primary:hover, .action-primary:focus-visible { background: #0b626c; color: #fff; }
    main { width: min(100% - 48px, 1560px); margin: 0 auto; padding: 16px 0; }
    .hint { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
    .hint::before { content: "↗"; margin-right: 6px; color: var(--accent); }
    .pdf-viewer { display: block; width: 100%; height: max(700px, calc(100dvh - 126px)); border: 1px solid var(--line); background: #fff; box-shadow: 0 2px 12px rgb(24 49 58 / 8%); }
    @media (max-width: 768px) {
      .site-header { align-items: flex-start; flex-direction: column; gap: 10px; }
      .header-actions { width: 100%; }
      .action { flex: 1; text-align: center; }
      main { width: min(100% - 24px, 1560px); padding: 12px 0; }
      .hint { margin-bottom: 8px; font-size: 12px; }
      .pdf-viewer { height: max(480px, calc(100dvh - 132px)); border-inline: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <p class="title">邓丽｜AI 售前解决方案 / 技术支持</p>
    <nav class="header-actions" aria-label="简历工具栏">
      <a class="action" href="../">返回作品集</a>
      <a class="action action-primary" href="./dengli-ai-presales-resume.pdf" download>下载 PDF</a>
    </nav>
  </header>
  <main>
    <p class="hint">提示：点击案例链接可直接查看案例。</p>
    <object class="pdf-viewer" data="./dengli-ai-presales-resume.pdf" type="application/pdf" aria-label="邓丽的 PDF 简历"></object>
  </main>
</body>
</html>
